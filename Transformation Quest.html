<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformation Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F5FA; --sheet: #FFFFFF; --grid: #E0E7F0; --grid-major: #C6D3E4;
  --ink: #15223D; --ink-2: #4A5A77;
  --blue: #0072B2; --blue-soft: #E2EFF8; --on-blue: #FFFFFF;
  --orange: #E69F00; --orange-ink: #8A5800;
  --green: #00775A; --green-soft: #DFF2EA;
  --red: #C24A00; --red-soft: #FBE8DD;
  --purple: #A24E88; --curve-parent: #8A97AD;
  --t-shift: var(--blue); --t-flip: var(--red); --t-stretch: var(--green); --t-squeeze: var(--purple);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1B2E; --sheet: #16243D; --grid: #1B2B45; --grid-major: #2B4166;
    --ink: #E8EEF7; --ink-2: #A8B6CD;
    --blue: #56B4E9; --blue-soft: #1B3653; --on-blue: #0F1B2E;
    --orange: #F0B23A; --orange-ink: #F6C766;
    --green: #3DC79B; --green-soft: #143A33;
    --red: #FF8A4C; --red-soft: #3D2419;
    --purple: #E08CC4; --curve-parent: #7D8CA6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1B2E; --sheet: #16243D; --grid: #1B2B45; --grid-major: #2B4166;
  --ink: #E8EEF7; --ink-2: #A8B6CD;
  --blue: #56B4E9; --blue-soft: #1B3653; --on-blue: #0F1B2E;
  --orange: #F0B23A; --orange-ink: #F6C766;
  --green: #3DC79B; --green-soft: #143A33;
  --red: #FF8A4C; --red-soft: #3D2419;
  --purple: #E08CC4; --curve-parent: #7D8CA6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font: 17px/1.55 var(--font-body);
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; font-weight: 750; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; margin-bottom: 8px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
[data-focus]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.help { color: var(--ink-2); font-size: 1rem; }
.err { color: var(--red); font-weight: 700; min-height: 0; }
.err:empty { display: none; }

.wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 64px; }
.stack > * + * { margin-top: 16px; }
.sheet { background: var(--sheet); border: 1.5px solid var(--grid-major); border-radius: 16px; padding: 18px; }
@media (min-width: 600px) { .sheet { padding: 24px; } }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--ink);
  background: var(--sheet); color: var(--ink); font-weight: 700; cursor: pointer; text-align: center;
}
.btn:hover { background: var(--blue-soft); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { width: 100%; min-height: 56px; font-family: var(--font-display); font-size: 1.2rem; font-weight: 750; border-radius: 14px; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 1rem; border-width: 1.5px; border-radius: 10px; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:disabled:hover { background: var(--sheet); }
.btn.warn, .btn.danger { border-color: var(--red); color: var(--red); }
.btn .cost { font-weight: 400; color: var(--ink-2); }
.btn.pu b { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; padding: 0 4px; border-radius: 999px; background: var(--orange); color: #1d1300; font-size: 0.85rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn.big { flex: 1 1 100%; }

/* math */
.m { font-family: var(--font-math); font-size: 1.12em; white-space: normal; }
.m i { font-style: italic; padding-right: 0.03em; }
.m .bo { margin: 0 0.22em; }
.m sup { font-size: 0.68em; line-height: 0; vertical-align: 0.62em; }
.rad { display: inline-flex; align-items: flex-start; white-space: nowrap; }
.rad .rs { line-height: 1; padding-top: 0.06em; }
.rad .rc { border-top: 0.075em solid currentColor; padding: 0.02em 0.08em 0; margin-top: 0.12em; line-height: 1.15; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.86em; margin: 0 0.12em; line-height: 1.15; }
.frac .fnum { border-bottom: 0.08em solid currentColor; padding: 0 0.18em 0.04em; }
.frac .fden { padding: 0.04em 0.18em 0; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1.5px solid var(--grid-major); }
.topbar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.me { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.avatar { font-size: 1.7rem; line-height: 1; width: 44px; height: 44px; display: grid; place-items: center; background: var(--sheet); border: 1.5px solid var(--grid-major); border-radius: 12px; }
.avatar.big { width: 72px; height: 72px; font-size: 2.6rem; border-radius: 18px; }
.me-text { display: flex; flex-direction: column; min-width: 0; }
.nick { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.95rem; color: var(--ink-2); }
.team-tag::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--tc); }
.xpbox { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.xp-num { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.rank { font-size: 0.95rem; color: var(--ink-2); }
.nav { display: flex; gap: 8px; flex: 1 1 100%; }
@media (min-width: 620px) { .nav { flex: 0 0 auto; } }
.runbar { flex-wrap: nowrap; }
.runbar #quit { white-space: nowrap; flex: 0 0 auto; }
.rb-mid { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.rb-level { font-family: var(--font-display); font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-prog { color: var(--ink-2); font-size: 0.95rem; }
.rb-stats { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; white-space: nowrap; }
.rb-xp { font-family: var(--font-display); font-weight: 800; }
.streak small { color: var(--orange-ink); font-weight: 700; }

/* join */
.join .hero { margin: 8px 0 22px; }
.hero h1 { font-size: clamp(2.2rem, 10vw, 4.4rem); font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; font-variation-settings: "opsz" 96; overflow-wrap: anywhere; }
.hero-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 14px; }
@media (min-width: 640px) { .hero-row { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); align-items: center; gap: 24px; } }
.lede { font-size: 1.12rem; max-width: 34ch; color: var(--ink-2); }
.hero-fig { margin: 0; min-width: 0; }
.hero-graph { aspect-ratio: 16 / 10; }
.hero-eq { text-align: center; font-size: 1.35rem; margin-top: 8px; min-height: 2em; }
.lab { display: block; font-weight: 700; margin-bottom: 6px; }
.fieldblock > * + * { margin-top: 6px; }
input[type=text], input[type=number], textarea {
  font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--sheet);
  border: 2px solid var(--grid-major); border-radius: 10px; padding: 9px 12px; min-height: 46px; max-width: 100%;
}
#nick { width: 100%; max-width: 360px; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
input:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 30%, transparent); }
.avatars { display: flex; flex-wrap: wrap; gap: 8px; }
.av { width: 54px; height: 54px; font-size: 1.7rem; border-radius: 12px; border: 2px solid var(--grid-major); background: var(--sheet); cursor: pointer; }
.av[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px var(--blue); }
.teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .teams { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.teambtn { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px; border: 2px solid var(--grid-major); border-radius: 12px; background: var(--sheet); font-weight: 700; cursor: pointer; text-align: left; }
.teambtn[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.tdot { width: 14px; height: 14px; border-radius: 4px; background: var(--tc); flex: 0 0 auto; }
.tdot.rnd { background: conic-gradient(var(--t-shift) 0 25%, var(--t-flip) 0 50%, var(--t-stretch) 0 75%, var(--t-squeeze) 0); }

/* graph */
.graph { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: min(60vh, 440px); background: var(--sheet); border: 1.5px solid var(--grid-major); border-radius: 14px; overflow: hidden; }
.graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1rem; color: var(--ink-2); align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.sw { display: inline-block; width: 28px; height: 0; border-top: 3px solid; }
.sw.dash { border-top: 2px dashed var(--curve-parent); }
.sw.blue { border-color: var(--blue); }
.sw.target { border-top-width: 9px; border-color: var(--orange); opacity: 0.55; border-radius: 4px; }
.dotkey { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); display: inline-block; }
.qgraph { margin: 0; }
.qgraph figcaption { margin-top: 8px; }

/* rank card and map */
.rankcard > * + * { margin-top: 12px; }
.rankrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.rankname { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; }
.meter { height: 12px; border-radius: 8px; background: var(--grid); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--orange); border-radius: 8px; }
.pups { display: flex; flex-wrap: wrap; gap: 8px; }
.pup { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border: 1.5px solid var(--grid-major); border-radius: 999px; font-weight: 700; font-size: 0.97rem; background: var(--sheet); }
.pup b { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 999px; background: var(--orange); color: #1d1300; font-size: 0.85rem; }
.map { position: relative; padding: 10px 0 4px; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.trail .seg { fill: none; stroke-width: 5; stroke-linecap: round; }
.trail .seg.on { stroke: var(--blue); }
.trail .seg.off { stroke: var(--grid-major); stroke-dasharray: 1 11; stroke-width: 5; }
.lvl {
  position: relative; display: flex; align-items: center; gap: 14px; width: fit-content; max-width: calc(100% - var(--off) * max(20px, 100% - 420px));
  margin: 0 0 28px calc(var(--off) * max(20px, 100% - 420px)); padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
}
.node {
  flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  font: 800 1.6rem/1 var(--font-display); background: var(--sheet); border: 3px solid var(--blue); color: var(--blue);
  box-shadow: 0 0 0 6px var(--paper);
}
.lvl.done .node { background: var(--blue); color: var(--on-blue); }
.lvl.locked .node { border: 3px dashed var(--grid-major); color: var(--ink-2); }
.node .lock { width: 22px; height: 22px; }
.lvl-text { display: flex; flex-direction: column; gap: 2px; background: var(--sheet); border: 1.5px solid var(--grid-major); border-radius: 12px; padding: 10px 14px; max-width: 330px; }
.lvl:hover .lvl-text, .lvl:focus-visible .lvl-text { border-color: var(--blue); }
.lvl.locked .lvl-text { border-style: dashed; }
.lvl.locked:hover .lvl-text { border-color: var(--grid-major); }
.lvl-name { font: 750 1.12rem/1.2 var(--font-display); }
.lvl-desc { color: var(--ink-2); font-size: 1rem; line-height: 1.35; }
.lvl-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 0.97rem; margin-top: 4px; }
.lockline { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.stars { color: var(--orange); letter-spacing: 2px; }
.lvl:last-child { margin-bottom: 0; }

/* question */
.timerwrap { display: flex; align-items: center; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 5; background: var(--paper); padding: 6px 0; }
.timer { flex: 1 1 auto; height: 12px; border-radius: 8px; background: var(--grid); overflow: hidden; border: 1px solid var(--grid-major); }
.timer > span { display: block; height: 100%; width: 100%; background: var(--blue); transition: width 0.1s linear; }
.timer.warn > span { background: var(--orange); }
.timer.crit > span { background: var(--red); }
.timer-text { font: 800 1.05rem var(--font-display); min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
.prompt { font-family: var(--font-body); font-weight: 700; font-size: 1.22rem; line-height: 1.45; letter-spacing: 0; }
.prompt:focus { outline: none; }
.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; padding: 12px 14px; min-height: 54px;
  border: 2px solid var(--grid-major); border-radius: 12px; background: var(--sheet); cursor: pointer; font-size: 1.04rem; line-height: 1.4;
}
.choice:hover { border-color: var(--blue); }
.choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); box-shadow: inset 0 0 0 1px var(--blue); }
.choice.gone { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }
.choice.stmt { flex-direction: row; align-items: flex-start; gap: 12px; }
.stn { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--grid); font-weight: 700; font-size: 0.95rem; }
.cname { font-size: 0.95rem; color: var(--ink-2); }
.plab { font-weight: 700; }
.field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.flabel { font-weight: 700; }
.pt { display: inline-flex; align-items: center; gap: 4px; font-size: 1.4rem; font-family: var(--font-math); }
.num { width: 6em; text-align: center; }
.pre .m { font-size: 1.2em; }
.eq-in { flex: 1 1 220px; }
.eqblock > * + * { margin-top: 8px; }
.keypad { display: flex; flex-wrap: wrap; gap: 6px; }
.keypad button { min-width: 48px; min-height: 42px; border: 1.5px solid var(--grid-major); border-radius: 10px; background: var(--sheet); font-weight: 700; cursor: pointer; }
.keypad button:hover { border-color: var(--blue); }
.preview { min-height: 1.6em; padding: 4px 0 4px 12px; border-left: 3px solid var(--blue); }
.preview:empty { display: none; }
.preview.bad { border-left-color: var(--grid-major); color: var(--ink-2); }
.seg { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 700; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
.orderblock > * + * { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--grid-major); background: var(--sheet); border-radius: 999px; padding: 7px 14px; min-height: 44px; cursor: pointer; font-weight: 700; font-size: 1rem; }
.chip:hover:not(:disabled) { border-color: var(--blue); }
.chip:disabled { opacity: 0.3; cursor: default; }
.seq { list-style: none; margin: 0; padding: 12px; border: 2px dashed var(--grid-major); border-radius: 12px; min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; counter-reset: s; align-items: center; }
.seq li { counter-increment: s; }
.seq li.empty { counter-increment: none; color: var(--ink-2); }
.seq .chip.on { border-color: var(--blue); background: var(--blue-soft); }
.seq .chip.on::before { content: counter(s) ". "; color: var(--blue); }
.hintbox { padding: 12px 14px; border-radius: 12px; background: var(--blue-soft); border-left: 4px solid var(--blue); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools-note { text-align: center; }

/* boss */
.boss { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
.monster { width: 112px; height: auto; overflow: visible; display: block; }
.monster .mon-body { transform-box: view-box; transform-origin: 110px 158px; transition: transform 0.9s cubic-bezier(.55, 0, .7, .2); }
.monster.down .mon-body, .monster.defeated .mon-body { transform: scaleY(0.07); }
.monster.hit { animation: shake 0.5s; }
.monster.taunt .pupil { animation: look 0.9s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes look { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.boss-name { font: 800 1.15rem var(--font-display); }
.hp { height: 16px; border-radius: 9px; background: var(--grid); overflow: hidden; border: 2px solid var(--ink); margin: 6px 0; }
.hp > span { display: block; height: 100%; background: var(--red); transition: width 0.7s ease; }
.hearts { font-size: 1.5rem; color: var(--red); letter-spacing: 3px; line-height: 1.1; }
.hearts .lost { color: var(--grid-major); }
.hearts .pop { display: inline-block; animation: pop 0.6s; }
@keyframes pop { 0% { transform: scale(1.6); color: var(--red); } 100% { transform: scale(1); } }
.boss-msg { margin-top: 6px; font-weight: 700; }
.done-card .monster { width: 150px; margin: 0 auto; }

/* feedback */
.verdict { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 12px 16px; border-radius: 14px; font: 800 1.45rem/1.2 var(--font-display); }
.verdict:focus { outline: none; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.no { background: var(--red-soft); color: var(--red); }
.verdict.neutral { background: var(--blue-soft); color: var(--blue); }
.vicon { font-size: 1.5rem; }
.xpgain { margin-left: auto; color: var(--orange-ink); font-size: 1.3rem; }
.bd { color: var(--ink-2); font-size: 1rem; word-spacing: 2px; }
.ans { display: grid; gap: 2px; }
.anslab { font-weight: 700; font-size: 0.97rem; color: var(--ink-2); }
.anim { margin: 0; }
.steps { margin: 0; padding-left: 1.4em; }
.steps li { color: var(--ink-2); padding: 2px 0; }
.steps li.active { color: var(--blue); font-weight: 700; }
.steps li.done { color: var(--ink); }
.bigstars { font-size: 2rem; color: var(--orange); letter-spacing: 6px; }

/* graph builder */
.gb-eq { font-size: 1.15rem; }
.gbstick { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; background: var(--sheet); padding: 6px 0 8px; border-bottom: 1.5px solid var(--grid-major); }
.gbstick > * + * { margin-top: 8px; }
@media (max-width: 640px) { .gbgraph { aspect-ratio: auto; height: min(34vh, 260px); } .gbstick .legend { font-size: 0.9rem; } }
.ctls { display: grid; gap: 14px; }
@media (min-width: 640px) { .ctls { grid-template-columns: 1fr 1fr; } }
.ctl { border: 1.5px solid var(--grid-major); border-radius: 12px; padding: 10px 12px; }
.ctl-top { display: flex; gap: 10px; align-items: baseline; }
.ctl-name { font-size: 1.4rem; min-width: 1em; }
.ctl-help { color: var(--ink-2); font-size: 0.95rem; line-height: 1.3; }
.ctl-in { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.ctl-in input[type=range] { flex: 1 1 auto; accent-color: var(--blue); min-height: 36px; }
.numbox { width: 5.2em; text-align: center; }

/* stats, badges, tables */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.stats > div { border: 1.5px solid var(--grid-major); border-radius: 12px; padding: 10px 12px; }
.stats dt { color: var(--ink-2); font-size: 0.95rem; }
.stats dd { margin: 0; font: 800 1.35rem/1.25 var(--font-display); }
.stats small { font: 400 0.95rem var(--font-body); color: var(--ink-2); }
.newbest { color: var(--green) !important; font-weight: 700 !important; }
.badgechips { display: flex; flex-wrap: wrap; gap: 8px; }
.bchip { padding: 6px 12px; border-radius: 999px; background: var(--blue-soft); font-weight: 700; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.badge { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--grid-major); border-radius: 12px; padding: 10px 12px; }
.badge.got { border-color: var(--orange); }
.badge.locked { opacity: 0.55; border-style: dashed; }
.bi { font-size: 1.7rem; line-height: 1.1; }
.bn { font-weight: 700; }
.bd2 { color: var(--ink-2); font-size: 0.95rem; line-height: 1.35; }
.scorecard { display: flex; align-items: center; gap: 14px; }
.sc-nick { font: 800 1.6rem/1.15 var(--font-display); }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ranks li { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); }
.ranks li.got { color: var(--ink); }
.ranks li.cur { background: var(--blue-soft); font-weight: 700; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 440px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--grid-major); }
thead th { color: var(--ink-2); font-size: 0.95rem; }
tbody th { font-weight: 700; }
.pulist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pulist li { display: grid; gap: 4px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--blue); }
#res { font-size: 1rem; }

/* overlay and toasts */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10, 18, 34, 0.55); display: grid; place-items: center; padding: 16px; }
.overlay .sheet { width: min(560px, 100%); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px; font-weight: 700; box-shadow: 0 8px 24px rgba(10, 18, 34, 0.25); animation: toastIn 0.25s ease-out; transition: opacity 0.3s, transform 0.3s; }
.toast.out { opacity: 0; transform: translateY(8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

    if (Math.abs(sx) > 0.02) { u0 = (this.x0 - 1 - h) / sx; u1 = (this.x1 + 1 - h) / sx; if (u0 > u1) { const t = u0; u0 = u1; u1 = t; } }
    else { u0 = -30; u1 = 30; }
    const ranges = [];
    if (pk === 'sqrt') { const a = Math.max(0, u0); if (u1 > a) ranges.push([a, u1, 'q']); }
    else if (pk === 'recip') {
      if (u0 < 0) ranges.push([Math.min(u1, -1e-3), u0, 'g']);
      if (u1 > 0) ranges.push([Math.max(u0, 1e-3), u1, 'g']);
    } else ranges.push([u0, u1, 'l']);
    const N = 800;
    for (const [a, b, mode] of ranges) {
      ctx.beginPath(); let pen = false;
      for (let i = 0; i <= N; i++) {
        const t = i / N; let u;
        if (mode === 'q') u = a + (b - a) * t * t;
        else if (mode === 'g' && Math.sign(a) === Math.sign(b) && Math.abs(b) > Math.abs(a)) u = a * Math.pow(b / a, t);
        else u = a + (b - a) * t;
        const y = f(u);
        if (!Number.isFinite(y)) { pen = false; continue; }
        const px = cl(this.X(sx * u + h)), py = cl(this.Y(sy * y + k));
        if (!pen) { ctx.moveTo(px, py); pen = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    if (pk === 'sqrt' && st.endpoint) {
      ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.fillStyle = st.color;
      ctx.beginPath(); ctx.arc(this.X(h), this.Y(k), 4.5, 0, Math.PI * 2); ctx.fill();
    }
    if (pk === 'recip' && st.asym) {
      ctx.setLineDash([5, 6]); ctx.lineWidth = 1.5; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(this.X(h), 0); ctx.lineTo(this.X(h), this.h);
      ctx.moveTo(0, this.Y(k)); ctx.lineTo(this.w, this.Y(k)); ctx.stroke();
    }
    ctx.restore();
  }
  dot(x, y, color, hollow) {
    const ctx = this.ctx; if (!ctx) return;
    ctx.save(); ctx.setLineDash([]); ctx.beginPath(); ctx.arc(this.X(x), this.Y(y), hollow ? 5.5 : 6.5, 0, Math.PI * 2);
    if (hollow) { ctx.fillStyle = this.col.sheet; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke(); }
    else { ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = this.col.sheet; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore();
  }
}

function heroAnimation() {
  const plot = mkPlot($('#hero-graph'), { xmin: -7, xmax: 7, ymin: -5, ymax: 6 });
  const eqEl = $('#hero-eq');
  const seq = [{ a: 1, h: 0, k: 0 }, { a: 1, h: 3, k: 0 }, { a: -1, h: 3, k: 3 }, { a: -0.5, h: -2, k: 3 }, { a: 2, h: -2, k: -3 }];
  const parentT = { sx: 1, h: 0, sy: 1, k: 0 };
  let T = paramsToT(seq[0]);
  plot.paint = p => {
    p.curve('square', parentT, { color: cssVar('--curve-parent'), dash: [6, 6], width: 2 });
    p.curve('square', T, { color: cssVar('--blue'), width: 4 });
  };
  const setEq = P => { eqEl.innerHTML = math('g(x) = ' + formatTransformed('square', P)); };
  if (reduceMotion) { T = paramsToT(seq[2]); setEq(seq[2]); plot.render(); return; }
  setEq(seq[0]);
  let cur = 0, start = null, from = T, to = T, raf = null, settled = false;
  const tick = now => {
    if (!plot.c.isConnected) return;
    if (start === null) start = now;
    if (now - start > 2800) { cur = (cur + 1) % seq.length; from = to; to = paramsToT(seq[cur]); start = now; settled = false; setEq(seq[cur]); }
    const q = Math.min(1, (now - start) / 1000);
    if (!settled) { T = lerpT(from, to, ease(q)); plot.render(); if (q >= 1) settled = true; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  cleanups.push(() => cancelAnimationFrame(raf));
}

function refreshTools() {

/* ---------- timer ---------- */
function startTimer() {
  if (!qs || !qs.limit) return;
  let last = performance.now(); updateTimer();
  timerId = setInterval(() => {
    const now = performance.now(); qs.left -= (now - last) / 1000; last = now;
    if (qs.left <= 0) { qs.left = 0; updateTimer(); submitQuestion(true); return; }
    updateTimer();
  }, 100);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function updateTimer() {
  const bar = $('#timer-bar'), txt = $('#timer-text'), t = $('#timer'); if (!bar) return;
  const f = Math.max(0, Math.min(1, qs.left / qs.limit));
  bar.style.width = (f * 100) + '%';
  const secs = Math.ceil(qs.left); txt.textContent = secs + ' s';
  t.classList.toggle('warn', qs.left <= 10 && qs.left > 5); t.classList.toggle('crit', qs.left <= 5);
}

/* ---------- scoring ---------- */
function multiplier() { return session.streak >= 5 ? 2 : session.streak >= 3 ? 1.5 : 1; }
function afterAnswer(q, ok, hintUsed) {
  const L = run.L;
  if (hintUsed) run.hintsUsed++;
  if (session.streak > S.bestStreak) S.bestStreak = session.streak;
  if (ok && !L.final) {
    if (session.streak === 3) { S.powerups.peek++; toast('Power-up earned: Graph Peek'); }
    if (session.streak === 5) { S.powerups.fifty++; toast('Power-up earned: 50/50'); }
  }
  if (session.streak >= 5) award('fire');
  if (ok && q.tag === 'reflection-axis' && !S.reflectOk.includes(q.id)) { S.reflectOk.push(q.id); if (REFLECT_IDS.every(id => S.reflectOk.includes(id))) award('mirror'); }
  if (ok && L.id === '1') { run.glitch++; if (run.glitch >= 3) award('glitch'); }
  if (ok && L.id === '2') { run.shift++; if (run.shift >= 8) award('shooter'); }
  if (!L.final && !run.freezeGiven && run.hintsUsed === 0 && run.answered >= 3) { run.freezeGiven = true; S.powerups.freeze++; toast('Power-up earned: Time Freeze'); }
}
function bossHit(ok) {
  const B = run.boss, ev = { prevHp: B.hp, prevHearts: B.hearts };
  if (ok) {
    if (B.defeated) ev.ev = 'bonus';
    else { B.hp--; if (B.hp <= 0) { B.hp = 0; B.defeated = true; ev.ev = 'defeat'; award('boss'); } else ev.ev = 'hit'; }
  } else if (B.defeated) ev.ev = 'flat';
  else { B.hearts--; if (B.hearts <= 0) { B.hearts = 0; B.lost = true; ev.ev = 'lost'; } else ev.ev = 'miss'; }

}
function submitQuestion(timedOut) {

  const q = qs.q, L = run.L;
  const grades = q.parts.map((p, i) => gradePart(p, qs.parts[i], i));
  if (!timedOut) {
    const bad = grades.find(g => !g.complete);
    if (bad) { $('#q-err').textContent = bad.msg || 'Answer every part before checking.'; return; }
  }
  qs.done = true; stopTimer();
  const textOnly = !isGradable(q);
  const ok = !textOnly && grades.every(g => g.complete && g.ok);
  const fb = { q, ok, timedOut: !!timedOut && !ok, textOnly, xp: 0, bd: [],
    given: grades.map(g => (g.complete ? g.html : '<em>No answer</em>')).join('<br>'),
    givenText: grades.map(g => (g.complete ? g.text : '(no answer)')).join('; ') };
  let gained = 0;
  if (!textOnly) {
    run.answered++;
    if (ok) {
      session.streak++; run.correct++;
      const base = L.points || 100;
      const speed = qs.limit ? Math.min(50, Math.round(50 * Math.max(0, qs.left) / qs.limit)) : 0;
      const hint = qs.hint ? 25 : 0, mult = multiplier();
      gained = Math.max(0, Math.round((base + speed - hint) * mult));
      fb.bd.push(base + ' correct'); if (speed) fb.bd.push('+' + speed + ' speed'); if (hint) fb.bd.push('\u2212' + hint + ' hint'); if (mult > 1) fb.bd.push('\u00D7' + mult + ' streak');
    } else session.streak = 0;
  }
  const reasonEl = $('#reason'), reason = reasonEl ? reasonEl.value.trim() : '';
  const tg = grades.find(g => g.words);
  if ((reason && reason.split(/\s+/).length >= 6) || (tg && tg.words >= 6)) {
    gained += 25; fb.bd.push('+25 explanation'); S.explainCount++; if (S.explainCount >= 3) award('explainer');
  }
  fb.xp = gained; run.xp += gained;
  if (!textOnly) afterAnswer(q, ok, qs.hint);
  if (L.final) run.exit[q.id] = { answer: fb.givenText, correct: textOnly ? null : ok };
  if (run.boss && !textOnly) fb.boss = bossHit(ok);
  save();
  renderFeedback(fb);
}

/* ---------- feedback ---------- */
function animBlock(fx) {
  const steps = transformSteps(fx);
  return `<figure class="anim stack">
    <div class="graph" id="fb-graph" role="img" aria-label="${esc('Graph showing y = ' + plain(PARENTS[fx.parent].math) + ' transformed into g(x) = ' + plain(formatTransformed(fx.parent, fx)) + '. Steps: ' + (steps.map(s => s.label).join(', ') || 'none'))}"></div>
    <div class="legend" aria-hidden="true"><span><i class="sw dash"></i>Parent ${math('y = ' + PARENTS[fx.parent].math)}</span><span><i class="sw blue"></i>${math('g(x) = ' + formatTransformed(fx.parent, fx))}</span>${fx.pt ? '<span><i class="dotkey"></i>Point moving</span>' : ''}</div>
    ${fx.note ? `<p class="help">${rich(fx.note)}</p>` : ''}
    ${steps.length ? `<ol class="steps" id="fb-steps">${steps.map(s => `<li>${esc(s.label)}</li>`).join('')}</ol>` : ''}
    <button type="button" class="btn small" id="replay">Replay animation</button>
  </figure>`;
}
function startAnim(fx) {
  const plot = mkPlot($('#fb-graph'), fx.view), pk = fx.parent, steps = transformSteps(fx), P0 = { sx: 1, h: 0, sy: 1, k: 0 };
  let T = P0; const lis = $$('#fb-steps li');
  plot.paint = p => {
    p.curve(pk, P0, { color: cssVar('--curve-parent'), dash: [6, 6], width: 2 });
    p.curve(pk, T, { color: cssVar('--blue'), width: 3.5, endpoint: true, asym: true });
    if (fx.pt) { p.dot(fx.pt[0], fx.pt[1], cssVar('--curve-parent'), true); const m = mapPt(fx.pt, T); p.dot(m[0], m[1], cssVar('--orange')); }
  };
  let raf = null, timeout = null, token = 0;
  const finish = () => { T = steps.length ? steps[steps.length - 1].to : P0; lis.forEach(li => { li.classList.remove('active'); li.classList.add('done'); }); plot.render(); };
  const play = () => {
    token++; const my = token; if (raf) cancelAnimationFrame(raf); clearTimeout(timeout);
    if (reduceMotion || !steps.length) { finish(); return; }
    T = P0; lis.forEach(li => li.classList.remove('active', 'done')); plot.render();
    let si = 0, t0 = null; const DUR = 850, HOLD = 450;
    const frame = ts => {
      if (my !== token || !plot.c.isConnected) return;
      if (t0 === null) { t0 = ts; lis.forEach((li, i) => li.classList.toggle('active', i === si)); }
      const e = Math.min(1, (ts - t0) / DUR);
      T = lerpT(steps[si].from, steps[si].to, ease(e)); plot.render();
      if (ts - t0 >= DUR + HOLD) { if (lis[si]) { lis[si].classList.remove('active'); lis[si].classList.add('done'); } si++; t0 = null; if (si >= steps.length) return; }
      raf = requestAnimationFrame(frame);
    };
    timeout = setTimeout(() => { raf = requestAnimationFrame(frame); }, 450);
  };
  play();
  $('#replay').addEventListener('click', play);
  cleanups.push(() => { token++; if (raf) cancelAnimationFrame(raf); clearTimeout(timeout); });
}
function renderFeedback(fb) {
  const q = fb.q, L = run.L;
  const last = run.idx >= L.items.length - 1 || (run.boss && run.boss.lost);
  let cls, icon, title;
  if (fb.textOnly) { cls = 'neutral'; icon = '\u270E'; title = 'Saved for your SI leader'; }
  else if (fb.gb) { cls = 'ok'; icon = '\u2713'; title = `Matched in ${fb.gb.moves} move${fb.gb.moves === 1 ? '' : 's'}`; }
  else if (fb.ok) { cls = 'ok'; icon = '\u2713'; title = 'Correct'; }
  else if (fb.timedOut) { cls = 'no'; icon = '\u23F1'; title = "Time's up"; }
  else if (fb.skipped) { cls = 'no'; icon = '\u21B7'; title = 'Round skipped'; }
  else { cls = 'no'; icon = '\u2715'; title = 'Not quite'; }
  show(`${runbar()}<main class="wrap stack">
    ${run.boss && fb.boss ? bossPanel(fb.boss) : ''}
    <section class="sheet stack fb">
      <div class="verdict ${cls}" data-focus tabindex="-1"><span class="vicon" aria-hidden="true">${icon}</span><span class="vtitle">${title}</span>${fb.xp ? `<span class="xpgain">+${fmtXP(fb.xp)} XP</span>` : ''}</div>
      ${fb.gb ? `<p class="bigstars" aria-label="${fb.gb.stars} of 3 stars">${starStr(fb.gb.stars)}</p>` : ''}

/* ---------- graph builder ---------- */
const CTL = {
  a: { min: -4, max: 4, step: 0.5, def: 1, help: 'Vertical stretch or compression. Negative flips across the x-axis.' },
  b: { min: -4, max: 4, step: 0.5, def: 1, help: 'Horizontal stretch or compression. Negative flips across the y-axis.' },
  h: { min: -8, max: 8, step: 1, def: 0, help: 'Horizontal shift. Positive moves right.' },
  k: { min: -8, max: 8, step: 1, def: 0, help: 'Vertical shift. Positive moves up.' }
};
function ctlHTML(n) {
  const c = CTL[n];
  return `<div class="ctl"><div class="ctl-top"><label for="r-${n}" class="ctl-name">${math(n)}</label><span class="ctl-help" id="h-${n}">${c.help}</span></div>
    <div class="ctl-in"><input type="range" id="r-${n}" data-p="${n}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.def}" aria-describedby="h-${n}">
    <input type="number" class="numbox" id="n-${n}" data-p="${n}" step="any" value="${c.def}" aria-label="${n} value"></div></div>`;
}
function renderGB(q) {
  gb = { q, v: { a: 1, b: 1, h: 0, k: 0 }, moves: 0, lastP: null, lastT: 0, hints: 0, said: [] };
  qs = null;
  show(`${runbar()}<main class="wrap stack">
    <section class="sheet stack">
      <h2 class="prompt" data-focus tabindex="-1">Graph Builder: match the target</h2>
      <p>${rich(q.prompt)}</p>
      <p class="muted">Set ${math('a')}, ${math('b')}, ${math('h')} and ${math('k')} in ${math('g(x) = a*f(b(x - h)) + k')} so your curve sits exactly on the target. Fewer moves earn more stars.</p>
      <div class="gbstick">
        <div class="graph gbgraph" id="gb-graph" role="img"></div>
        <div class="legend" aria-hidden="true"><span><i class="sw dash"></i>Parent</span><span><i class="sw target"></i>Target</span><span><i class="sw blue"></i>Your graph</span></div>
        <p class="gb-eq">Your graph: <span id="gb-eq"></span></p>
      </div>
      <div class="ctls">${['a', 'b', 'h', 'k'].map(ctlHTML).join('')}</div>
      <p class="gb-status" id="gb-moves" aria-live="polite"></p>
      <div class="hintbox" id="hintbox" hidden></div>
      <p class="err" id="q-err" role="alert"></p>
    </section>
    <div class="tools" role="group" aria-label="Graph Builder tools">
      <button type="button" class="btn small" id="gb-hint">Hint <span class="cost">\u221225 XP</span></button>
      <button type="button" class="btn small" id="gb-reset">Reset sliders</button>
      <button type="button" class="btn small" id="gb-skip">Skip round</button>
    </div>
    <button type="button" class="btn primary big" id="gb-check">Check match</button>
  </main>`, () => {
    bindQuit();
    const pk = q.parent;
    const plot = mkPlot($('#gb-graph'), q.fx.view);
    const targetT = paramsToT(q.target), P0 = { sx: 1, h: 0, sy: 1, k: 0 };
    plot.paint = p => {
      p.curve(pk, P0, { color: cssVar('--curve-parent'), dash: [6, 6], width: 2 });
      p.curve(pk, targetT, { color: cssVar('--orange'), width: 10, alpha: 0.45, endpoint: true });
      p.curve(pk, paramsToT(gb.v), { color: cssVar('--blue'), width: 3, endpoint: true, asym: true });
    };
    const update = () => {
      const f = formatTransformed(pk, gb.v);
      $('#gb-eq').innerHTML = math('g(x) = ' + f);
      $('#gb-graph').setAttribute('aria-label', 'Target: ' + plain(q.prompt.replace(/^Parent[^.]*\.\s*Target:\s*/, '')) + ' Your graph: g(x) = ' + plain(f) + '.');
      const m = gb.moves, stars = m <= q.min ? 3 : m <= q.min + 2 ? 2 : 1;
      $('#gb-moves').innerHTML = `Moves: <b>${m}</b>. Fewest possible: ${q.min}. <span class="stars">${starStr(stars)}</span> <span class="sr">${stars} stars</span> if you match now.`;
      plot.render();
    };
    const onChange = el => {
      const n = el.dataset.p, v = parseFloat(el.value);
      if (!Number.isFinite(v)) return;
      gb.v[n] = v;
      if (el.type === 'range') $('#n-' + n).value = v; else $('#r-' + n).value = v;
      const now = performance.now();
      if (gb.lastP !== n || now - gb.lastT > 1500) gb.moves++;
      gb.lastP = n; gb.lastT = now;
      $('#q-err').textContent = '';

    };
    $$('.ctl input').forEach(el => el.addEventListener('input', () => onChange(el)));
    $$('.numbox').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } }));
    $('#gb-reset').addEventListener('click', () => {
      ['a', 'b', 'h', 'k'].forEach(n => { gb.v[n] = CTL[n].def; $('#r-' + n).value = CTL[n].def; $('#n-' + n).value = CTL[n].def; });
      gb.lastP = null; update();
    });
    $('#gb-hint').addEventListener('click', () => {
      const n = ['h', 'k', 'a', 'b'].find(x => Math.abs(gb.v[x] - q.target[x]) > 1e-9 && !gb.said.includes(x));
      const box = $('#hintbox'); box.hidden = false;
      if (!n) { box.innerHTML += (box.innerHTML ? '<br>' : '') + 'Your settings already use the target values you have been given. Press Check match.'; return; }
      gb.hints++; gb.said.push(n);
      const why = { h: 'to move the graph sideways', k: 'to move it up or down', a: 'for the vertical stretch or flip', b: 'for the horizontal stretch or flip' }[n];
      box.innerHTML += (box.innerHTML ? '<br>' : '<strong>Hints:</strong> ') + `Set ${math(n)} to ${math(fmtN(q.target[n]))} ${why}.`;
    });
    const finish = (ok, skipped) => {
      const fb = { q, ok, textOnly: false, xp: 0, bd: [], skipped };

        fb.xp = Math.max(0, Math.round((base - hint) * mult));

        fb.bd.push(base + ' for ' + stars + ' star' + (stars === 1 ? '' : 's')); if (hint) fb.bd.push('\u2212' + hint + ' hints'); if (mult > 1) fb.bd.push('\u00D7' + mult + ' streak');
        if (stars === 3 && !S.threeStars.includes(q.id)) { S.threeStars.push(q.id); if (S.threeStars.length >= 3) award('stretch'); }
      } else {
        session.streak = 0;

      }
      run.xp += fb.xp;

      if (run.boss) fb.boss = bossHit(ok);

    };

      if (sameFn(transformedFn(pk, gb.v), transformedFn(pk, q.target))) finish(true, false);

      if (skip.dataset.armed) { finish(false, true); return; }
      skip.dataset.armed = '1'; skip.textContent = 'Tap again to skip';
      setTimeout(() => { if (skip.isConnected) { delete skip.dataset.armed; skip.textContent = 'Skip round'; } }, 3000);
    });
    update();
  });
}

/* ---------- end of level ---------- */
function endLevel() {
  const L = run.L;
  const gradable = L.items.filter(id => isGradable(Q[id])).length;
  const acc = gradable ? run.correct / gradable : 1;
  const prev = S.levels[L.id];
  const isNewBest = !prev || run.xp > prev.bestXP;
  if (prev && run.xp > prev.bestXP) award('comeback');
  S.levels[L.id] = { bestXP: Math.max(prev ? prev.bestXP : 0, run.xp), bestAcc: Math.max(prev ? prev.bestAcc : 0, acc), plays: (prev ? prev.plays : 0) + 1, lastXP: run.xp, lastAcc: acc };
  if (L.final) S.exit = { when: new Date().toISOString(), answers: run.exit };
  save();
  if (L.final) renderFinale(); else renderLevelDone(acc, isNewBest, gradable);
}

      <p class="help">Erases XP, badges, power-ups and exit ticket answers on this device.</p></div>
  </section></main>`, () => {
    $$('[data-timer]').forEach(b => b.addEventListener('click', () => { S.settings.timer = b.dataset.timer; save(); $$('[data-timer]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    $('#unlockall').addEventListener('change', e => { S.settings.unlockAll = e.target.checked; save(); });
    $('#editp').addEventListener('click', () => renderJoin(true));
    const r = $('#reset');
    r.addEventListener('click', () => {
      if (r.dataset.armed) { S = fresh(); session.streak = 0; save(); renderJoin(false); return; }
      r.dataset.armed = '1'; r.textContent = 'Tap again to erase everything';
      setTimeout(() => { if (r.isConnected) { delete r.dataset.armed; r.textContent = 'Reset all progress'; } }, 4000);
    });
  });
}

if (S.profile) renderMap(); else renderJoin(false);
